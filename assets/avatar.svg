<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#131f37" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="400" height="400" rx="36" fill="url(#cardBg)" />

  <!-- Radial Tech Glow in Center -->
  <circle cx="200" cy="200" r="160" fill="url(#centerGlow)" />

  <!-- Outer Tech Border Ring -->
  <rect x="24" y="24" width="352" height="352" rx="28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Corner Tech Accent Nodes -->
  <circle cx="24" cy="24" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="376" cy="24" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="24" cy="376" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="376" cy="376" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Concentric Orbital Grid Rings -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 6" stroke-opacity="0.3" />
  <circle cx="200" cy="180" r="92" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" filter="url(#badgeShadow)" />

  <!-- Inner Concentric Ring -->
  <circle cx="200" cy="180" r="82" fill="url(#cardBg)" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Subtle Code Brackets on flanks -->
  <text x="65" y="190" font-family="'Fira Code', 'Courier New', monospace" font-size="28" font-weight="700" fill="#38bdf8" fill-opacity="0.35">&lt;</text>
  <text x="315" y="190" font-family="'Fira Code', 'Courier New', monospace" font-size="28" font-weight="700" fill="#38bdf8" fill-opacity="0.35">/&gt;</text>

  <!-- Central Monogram "KN" -->
  <text x="200" y="200" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">KN</text>

  <!-- Bottom Terminal Tag -->
  <g transform="translate(85, 305)">
    <rect width="230" height="42" rx="12" fill="#131f37" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#f8fafc">SOFTWARE ENGINEER</text>
  </g>
</svg>
